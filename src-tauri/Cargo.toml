[package]
name = "pocket-stata"
version = "1.0.0"
description = "A lightweight cross-platform Stata file viewer and editor"
authors = ["HodTech", "DirRain"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
csv = "1.3"
calamine = "0.24"
memmap2 = "0.9"
rayon = "1.10"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
bytes = "1.7"
tempfile = "3.14"
uuid = { version = "1", features = ["v4"] }
regex = "1.11"
lru = "0.12"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
